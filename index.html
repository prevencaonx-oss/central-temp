<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173653"><title>Central Temp V20</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f4f6;color:#173653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto 14px;background:#173653;color:#fff;font-weight:900}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:12px;color:#74818e;margin-top:7px}.error{color:#a43131;max-width:460px;line-height:1.5}</style></head><body><div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div class="msg">Carregando versão 20...</div><div class="spin"></div></div></div><script>(async()=>{try{const names=['v17-p01.txt','v17-p02.txt','v17-p03.txt','v17-p04.txt','v17-p05.txt','v17-p06.txt','v17-p07.txt','v17-p08.txt'];let b='';for(const n of names){const r=await fetch(n+'?build=20',{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+n);b+=(await r.text()).trim()}const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Este navegador precisa ser atualizado.');const ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const start=txt.indexOf('function showModal');const end=txt.indexOf('\n\nif(configured)',start);if(start<0||end<0)throw new Error('Não foi possível localizar o módulo de janelas.');const fixed='function showModal(content,closable=true){\n const host=document.getElementById("modalHost");\n if(!host)return;\n host.innerHTML="";\n const overlay=document.createElement("div");\n overlay.className="modal";\n if(closable)overlay.addEventListener("click",event=>{if(event.target===overlay)closeModal()});\n const box=document.createElement("div");\n box.className="modalBox";\n box.innerHTML=String(content??"");\n overlay.appendChild(box);\n host.appendChild(overlay);\n}\nwindow.closeModal=()=>{const host=document.getElementById("modalHost");if(host)host.innerHTML="";};';txt=txt.slice(0,start)+fixed+txt.slice(end);if(!txt.includes('function showModal(content,closable=true)'))throw new Error('Correção do modal não foi aplicada.');txt=txt.replace('<title>Central Temp V17 | Troca de Senha</title>','<title>Central Temp V20</title>');txt=txt.replace('</head>','<link rel="stylesheet" href="protected-admin-v18.css?v=20"></head>');txt=txt.replace('</body>','<script src="protected-admin-v18.js?v=20"><\/script></body>');document.open();document.write(txt);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div class="msg error">Não foi possível iniciar a V20. Atualize a página e tente novamente.</div></div></div>'}})();</script></body></html>
