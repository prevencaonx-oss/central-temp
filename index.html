<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f52"><title>Controle de Temperatura | Nilo V33</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#102653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{font-weight:1000;font-style:italic;font-size:42px;letter-spacing:-.08em;color:#ffe400;text-shadow:0 3px 0 #000}.sub{font-size:11px;color:#718096;margin-top:10px}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#071f52;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{font-size:11px;color:#a43131;margin-top:9px;max-width:760px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">NILO</div><b>CONTROLE DE TEMPERATURA</b><div id="status" class="sub">Abrindo V33...</div><div class="spin"></div><div id="error" class="error"></div></div></div><script>(async()=>{try{const names=["v32-p01.txt","v32-p02.txt","v32-q2.txt","v32-q3.txt","v32-q4.txt"];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=33',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return (await r.text()).trim()}));const joined=parts.join('');if(!/^[A-Za-z0-9+/=]+$/.test(joined))throw new Error('Pacote V32 contém caracteres inválidos.');const bytes=Uint8Array.from(atob(joined),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação.');const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!html.includes('Controle de Temperatura | Nilo V32')||!html.includes('</html>'))throw new Error('HTML V32 incompleto.');html=html.replace('<title>Controle de Temperatura | Nilo V32</title>','<title>Controle de Temperatura | Nilo V33</title>');const loginPatch=`<scr`+`ipt>(()=>{const install=()=>{const btn=document.querySelector('#loginPage button.btn.primary');if(!btn)return;btn.removeAttribute('onclick');if(btn.dataset.v33==='1')return;btn.dataset.v33='1';window.signIn=async()=>{const msg=document.getElementById('loginMsg');try{if(!configured)throw new Error('Sistema sem configuração do Supabase.');const username=document.getElementById('loginUsername').value.trim().toLowerCase();const password=document.getElementById('loginPassword').value;if(!username||!password){msg.textContent='Informe usuário e senha.';return;}msg.textContent='Entrando...';showLoad(true);const res=await sb.auth.signInWithPassword({email:emailFor(username),password});if(res.error)throw res.error;if(!res.data||!res.data.session)throw new Error('Sessão não foi criada.');state.session=res.data.session;await getMyProfile();if(!state.profile)throw new Error('Perfil não encontrado.');if(!state.profile.active)throw new Error('Usuário inativo.');msg.textContent='Login aceito. Carregando dados...';if(state.profile.role==='admin'){await fetchAll();showAdminStoreChoice();}else{state.activeStoreId=state.profile.store_id;await enterApp();}}catch(e){console.error('LOGIN_V33',e);msg.textContent='Falha ao entrar: '+String(e&&e.message?e.message:e);showLoad(false);}};btn.addEventListener('click',window.signIn);const pass=document.getElementById('loginPassword');if(pass&&!pass.dataset.v33){pass.dataset.v33='1';pass.removeAttribute('onkeydown');pass.addEventListener('keydown',e=>{if(e.key==='Enter')window.signIn();});}};install();new MutationObserver(()=>install()).observe(document.documentElement,{childList:true,subtree:true});})();</scr`+`ipt>`;html=html.replace('</body>',loginPatch+'</body>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('status').textContent='Não foi possível abrir a V33.';document.querySelector('.spin').style.display='none';document.getElementById('error').textContent=String(e&&e.message?e.message:e)}})();</script></body></html>
