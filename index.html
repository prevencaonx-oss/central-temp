<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173653"><title>Controle de Temperatura | Nilo V29</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f4f6;color:#173653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto 14px;background:#173653;color:#fff;font-weight:900}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:12px;color:#74818e;margin-top:7px}.error{font-size:11px;color:#a43131;margin-top:9px;max-width:650px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div id="status" class="msg">Abrindo Controle de Temperatura...</div><div class="spin"></div><div id="error" class="error"></div></div></div><script>(async()=>{
 const names=["v17-p01.txt", "v17-p02.txt", "v17-p03.txt", "v17-p04.txt", "v17-p05.txt", "v17-p06.txt", "v17-p07.txt", "v17-p08.txt"];
 try{
  const parts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=29',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return (await r.text()).trim()}));
  const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação.');
  const ds=new DecompressionStream('gzip');
  let txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  if(!txt.includes('Central Temp V17')||!txt.includes('</html>'))throw new Error('Versão interna incompleta.');
  txt=txt.replace('<title>Central Temp V17 | Troca de Senha</title>','<title>Controle de Temperatura | Nilo V29</title>');
  const accountMarker="     <div class=\"passwordChangeBox\">\n       <h3>Alterar minha senha</h3>";
  const accountReplacement="     <div style=\"margin-top:10px;padding:10px;border:1px solid #dfe6eb;border-radius:10px;background:#f8fafb\">\n       <label>Senha atual</label>\n       <input id=\"myCurrentPassword\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Obrigatória para confirmar a alteração\">\n       <div class=\"passwordHint\">Sua senha atual é usada apenas para confirmar sua identidade e não é armazenada em texto visível.</div>\n     </div>\n\n     <div class=\"passwordChangeBox\">\n       <h3>Alterar minha senha</h3>";
  if(!txt.includes(accountMarker))throw new Error('Bloco de segurança da conta não localizado.');
  txt=txt.replace(accountMarker,accountReplacement);
  txt=txt.replace('placeholder="Mínimo de 6 caracteres"','placeholder="Mínimo de 10 caracteres"');
  txt=txt.replace('A senha deve ter pelo menos 6 caracteres.','Senha forte: 10+ caracteres, maiúscula, minúscula, número, especial e sem espaços.');
  const s=txt.indexOf('window.saveMyAccount=async()=>{');
  const e=txt.indexOf('function val(id)',s);
  if(s<0||e<0)throw new Error('Função de segurança da conta não localizada.');
  txt=txt.slice(0,s)+"function securityPasswordErrors(password,username=\"\"){\n const p=String(password||\"\"),u=String(username||\"\").toLowerCase(),low=p.toLowerCase(),errors=[];\n if(p.length<10)errors.push(\"mínimo de 10 caracteres\");\n if(/\\s/.test(p))errors.push(\"sem espaços\");\n if(!/[a-z]/.test(p))errors.push(\"uma letra minúscula\");\n if(!/[A-Z]/.test(p))errors.push(\"uma letra maiúscula\");\n if(!/[0-9]/.test(p))errors.push(\"um número\");\n if(!/[^A-Za-z0-9]/.test(p))errors.push(\"um caractere especial\");\n if(u.length>=3&&low.includes(u))errors.push(\"não conter o nome de usuário\");\n if([\"123456\",\"password\",\"senha\",\"admin\",\"centraltemp\"].some(x=>low.includes(x)))errors.push(\"evitar termos previsíveis\");\n return errors;\n}\nwindow.saveMyAccount=async()=>{\n const currentPassword=val(\"myCurrentPassword\");\n const password=val(\"myPassword\");\n const confirmPassword=val(\"myPasswordConfirm\");\n const isAdmin=state.profile.role===\"admin\";\n const username=isAdmin?val(\"myUsername\").trim().toLowerCase():state.profile.username;\n const usernameChanged=isAdmin&&username!==state.profile.username;\n\n if(isAdmin&&!/^[a-z0-9][a-z0-9._-]{1,38}[a-z0-9]$/.test(username))\n   return toast(\"Nome de usuário inválido. Use 3 a 40 caracteres, sem espaços, começando e terminando com letra ou número.\",\"warn\");\n\n if(!password&&!usernameChanged)\n   return toast(\"Altere o nome de usuário ou informe uma nova senha.\",\"warn\");\n\n if(!currentPassword)\n   return toast(\"Informe sua senha atual para confirmar a alteração.\",\"warn\");\n\n if(password){\n   const errors=securityPasswordErrors(password,username);\n   if(errors.length)return toast(\"A nova senha ainda não atende à segurança exigida: \"+errors.join(\", \")+\".\",\"warn\");\n   if(password!==confirmPassword)return toast(\"As duas senhas não são iguais.\",\"warn\");\n   if(password===currentPassword)return toast(\"A nova senha precisa ser diferente da senha atual.\",\"warn\");\n }\n\n showLoad(true);\n try{\n   await callManageUser({\n     action:\"self_update\",\n     username,\n     current_password:currentPassword,\n     password\n   });\n   toast(usernameChanged&&password?\"Usuário e senha alterados. Entre novamente.\":usernameChanged?\"Nome de usuário alterado. Entre novamente.\":\"Senha alterada. Entre novamente.\",\"good\");\n   await sb.auth.signOut();\n   state.session=null;\n   state.profile=null;\n   setTimeout(()=>location.reload(),700);\n }catch(e){\n   toast(\"Não foi possível alterar sua conta: \"+(e?.message||e),\"bad\");\n }finally{\n   showLoad(false);\n }\n};\n\n"+txt.slice(e);
  const userTarget="if(!body.full_name||(!id&&!body.password))return toast(\"Preencha nome e senha inicial.\");";
  const userRepl="if(!body.full_name||(!id&&!body.password))return toast(\"Preencha nome e senha inicial.\");\n if(body.password){const errs=securityPasswordErrors(body.password,username);if(errs.length)return toast(\"A senha não atende à segurança exigida: \"+errs.join(\", \")+\".\",\"warn\");}";
  if(!txt.includes(userTarget))throw new Error('Validação de usuários não localizada.');
  txt=txt.replace(userTarget,userRepl);
  txt=txt.replace('</head>','<link rel="stylesheet" href="nilo-v25.css?v=29"></head>');
  txt=txt.replace('</body>','<script src="nilo-v25.js?v=29"></'+'script></body>');
  document.open();document.write(txt);document.close();
 }catch(e){
  console.error(e);
  document.getElementById('status').textContent='Não foi possível abrir a V29.';
  document.querySelector('.spin').style.display='none';
  document.getElementById('error').textContent=String(e&&e.message?e.message:e);
 }
})();</script></body></html>
