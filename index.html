<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173653"><title>Central Temp V19</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f4f6;color:#173653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto 14px;background:#173653;color:#fff;font-weight:900}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:12px;color:#74818e;margin-top:7px}.error{color:#a43131;max-width:420px;line-height:1.5}</style></head><body><div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div class="msg">Carregando versão 19...</div><div class="spin"></div></div></div><script>(async()=>{try{const names=['v17-p01.txt','v17-p02.txt','v17-p03.txt','v17-p04.txt','v17-p05.txt','v17-p06.txt','v17-p07.txt','v17-p08.txt'];let b='';for(const n of names){const r=await fetch(n+'?build=19',{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+n);b+=(await r.text()).trim()}const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Este navegador precisa ser atualizado para abrir o sistema.');const ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!txt.includes('Central Temp V17')||!txt.includes('</html>'))throw new Error('A versão recebida está incompleta.');const modalFix='<script>(()=>{window.showModal=function(content,closable=true){const host=document.getElementById("modalHost");if(!host)return;host.innerHTML="";const overlay=document.createElement("div");overlay.className="modal";if(closable)overlay.addEventListener("click",event=>{if(event.target===overlay&&typeof window.closeModal==="function")window.closeModal()});const box=document.createElement("div");box.className="modalBox";box.innerHTML=String(content??"");overlay.appendChild(box);host.appendChild(overlay)};window.closeModal=function(){const host=document.getElementById("modalHost");if(host)host.innerHTML=""};window.__CENTRAL_TEMP_MODAL_FIX__="V19"})();<\/script>';txt=txt.replace('</head>','<link rel="stylesheet" href="protected-admin-v18.css?v=19"></head>');txt=txt.replace('</body>',modalFix+'<script src="protected-admin-v18.js?v=19"><\/script></body>');document.open();document.write(txt);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div class="msg error">Não foi possível carregar a V19. Atualize a página. Se continuar, envie um print desta tela.</div></div></div>'}})();</script></body></html>
