<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f52"><title>Controle de Temperatura | Nilo V34</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#102653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{font-weight:1000;font-style:italic;font-size:42px;letter-spacing:-.08em;color:#ffe400;text-shadow:0 3px 0 #000}.sub{font-size:11px;color:#718096;margin-top:10px}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#071f52;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{font-size:11px;color:#a43131;margin-top:9px;max-width:760px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">NILO</div><b>CONTROLE DE TEMPERATURA</b><div id="status" class="sub">Abrindo V34...</div><div class="spin"></div><div id="error" class="error"></div></div></div><script>(async()=>{try{const names=["v32-p01.txt","v32-p02.txt","v32-q2.txt","v32-q3.txt","v32-q4.txt"];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=34',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return (await r.text()).trim()}));const joined=parts.join('');if(!/^[A-Za-z0-9+/=]+$/.test(joined))throw new Error('Pacote V32 contém caracteres inválidos.');const bytes=Uint8Array.from(atob(joined),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação.');const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!html.includes('Controle de Temperatura | Nilo V32')||!html.includes('</html>'))throw new Error('HTML V32 incompleto.');html=html.replace('<title>Controle de Temperatura | Nilo V32</title>','<title>Controle de Temperatura | Nilo V34</title>');const patch=`<scr`+`ipt>(()=>{const bind=()=>{const btn=document.querySelector('#loginPage button.btn.primary');if(!btn)return;btn.removeAttribute('onclick');if(btn.dataset.v34==='1')return;btn.dataset.v34='1';btn.addEventListener('click',()=>{const msg=document.getElementById('loginMsg');if(typeof window.signIn==='function')window.signIn();else if(msg)msg.textContent='Aguarde alguns segundos e tente novamente.';});const pass=document.getElementById('loginPassword');if(pass&&!pass.dataset.v34){pass.dataset.v34='1';pass.removeAttribute('onkeydown');pass.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(typeof window.signIn==='function')window.signIn();}});}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();let tries=0;const t=setInterval(()=>{bind();if(typeof window.signIn==='function'||++tries>100)clearInterval(t)},100);})();</scr`+`ipt>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('status').textContent='Não foi possível abrir a V34.';document.querySelector('.spin').style.display='none';document.getElementById('error').textContent=String(e&&e.message?e.message:e)}})();</script></body></html>
