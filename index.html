<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173653"><title>Controle de Temperatura | Nilo V26</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f4f6;color:#173653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto 14px;background:#173653;color:#fff;font-weight:900}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:12px;color:#74818e;margin-top:7px}.error{font-size:11px;color:#a43131;margin-top:9px;max-width:650px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div id="status" class="msg">Abrindo Controle de Temperatura...</div><div class="spin"></div><div id="error" class="error"></div></div></div><script>(async()=>{
 const names=["v17-p01.txt", "v17-p02.txt", "v17-p03.txt", "v17-p04.txt", "v17-p05.txt", "v17-p06.txt", "v17-p07.txt", "v17-p08.txt"];
 try{
  const parts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=26',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return (await r.text()).trim()}));
  const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação.');
  const ds=new DecompressionStream('gzip');
  let txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  if(!txt.includes('Central Temp V17')||!txt.includes('</html>'))throw new Error('Versão interna incompleta.');
  txt=txt.replace('<title>Central Temp V17 | Troca de Senha</title>','<title>Controle de Temperatura | Nilo V26</title>');
  const accountMarker="     <div class=\"passwordChangeBox\">\n       <h3>Alterar minha senha</h3>";
  const accountReplacement="     <div style=\"margin-top:10px;padding:10px;border:1px solid #dfe6eb;border-radius:10px;background:#f8fafb\">\n       <label>Senha atual</label>\n       <input id=\"myCurrentPassword\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Obrigat\u00f3ria para confirmar a altera\u00e7\u00e3o\">\n       <div class=\"passwordHint\">Sua senha atual \u00e9 usada apenas para confirmar sua identidade e n\u00e3o \u00e9 armazenada em texto vis\u00edvel.</div>\n     </div>\n\n     <div class=\"passwordChangeBox\">\n       <h3>Alterar minha senha</h3>";
  if(!txt.includes(accountMarker))throw new Error('Bloco de segurança da conta não localizado.');
  txt=txt.replace(accountMarker,accountReplacement);
  txt=txt.replace('placeholder="Mínimo de 6 caracteres"','placeholder="Mínimo de 10 caracteres"');
  txt=txt.replace('A senha deve ter pelo menos 6 caracteres.','Senha forte: 10+ caracteres, maiúscula, minúscula, número, especial e sem espaços.');
  const s=txt.indexOf('window.saveMyAccount=async()=>{');
  const e=txt.indexOf('function val(id)',s);
  if(s<0||e<0)throw new Error('Função de segurança da conta não localizada.');
  txt=txt.slice(0,s)+"function securityPasswordErrors(password,username=\"\"){\n const p=String(password||\"\"),u=String(username||\"\").toLowerCase(),low=p.toLowerCase(),errors=[];\n if(p.length<10)errors.push(\"m\u00ednimo de 10 caracteres\");\n if(/\\s/.test(p))errors.push(\"sem espa\u00e7os\");\n if(!/[a-z]/.test(p))errors.push(\"uma letra min\u00fascula\");\n if(!/[A-Z]/.test(p))errors.push(\"uma letra mai\u00fascula\");\n if(!/[0-9]/.test(p))errors.push(\"um n\u00famero\");\n if(!/[^A-Za-z0-9]/.test(p))errors.push(\"um caractere especial\");\n if(u.length>=3&&low.includes(u))errors.push(\"n\u00e3o conter o nome de usu\u00e1rio\");\n if([\"123456\",\"password\",\"senha\",\"admin\",\"centraltemp\"].some(x=>low.includes(x)))errors.push(\"evitar termos previs\u00edveis\");\n return errors;\n}\nwindow.saveMyAccount=async()=>{\n const currentPassword=val(\"myCurrentPassword\");\n const password=val(\"myPassword\");\n const confirmPassword=val(\"myPasswordConfirm\");\n const isAdmin=state.profile.role===\"admin\";\n const username=isAdmin?val(\"myUsername\").trim().toLowerCase():state.profile.username;\n const usernameChanged=isAdmin&&username!==state.profile.username;\n\n if(isAdmin&&!/^[a-z0-9][a-z0-9._-]{1,38}[a-z0-9]$/.test(username))\n   return toast(\"Nome de usu\u00e1rio inv\u00e1lido. Use 3 a 40 caracteres, sem espa\u00e7os, come\u00e7ando e terminando com letra ou n\u00famero.\",\"warn\");\n\n if(!password&&!usernameChanged)\n   return toast(\"Altere o nome de usu\u00e1rio ou informe uma nova senha.\",\"warn\");\n\n if(!currentPassword)\n   return toast(\"Informe sua senha atual para confirmar a altera\u00e7\u00e3o.\",\"warn\");\n\n if(password){\n   const errors=securityPasswordErrors(password,username);\n   if(errors.length)return toast(\"A nova senha ainda n\u00e3o atende \u00e0 seguran\u00e7a exigida: \"+errors.join(\", \")+\".\",\"warn\");\n   if(password!==confirmPassword)return toast(\"As duas senhas n\u00e3o s\u00e3o iguais.\",\"warn\");\n   if(password===currentPassword)return toast(\"A nova senha precisa ser diferente da senha atual.\",\"warn\");\n }\n\n showLoad(true);\n try{\n   await callManageUser({\n     action:\"self_update\",\n     username,\n     current_password:currentPassword,\n     password\n   });\n   toast(usernameChanged&&password?\"Usu\u00e1rio e senha alterados. Entre novamente.\":usernameChanged?\"Nome de usu\u00e1rio alterado. Entre novamente.\":\"Senha alterada. Entre novamente.\",\"good\");\n   await sb.auth.signOut();\n   state.session=null;\n   state.profile=null;\n   setTimeout(()=>location.reload(),700);\n }catch(e){\n   toast(\"N\u00e3o foi poss\u00edvel alterar sua conta: \"+(e?.message||e),\"bad\");\n }finally{\n   showLoad(false);\n }\n};\n\n"+txt.slice(e);
  const userTarget="if(!body.full_name||(!id&&!body.password))return toast(\"Preencha nome e senha inicial.\");";
  const userRepl="if(!body.full_name||(!id&&!body.password))return toast(\"Preencha nome e senha inicial.\");\n if(body.password){const errs=securityPasswordErrors(body.password,username);if(errs.length)return toast(\"A senha n\u00e3o atende \u00e0 seguran\u00e7a exigida: \"+errs.join(\", \")+\".\",\"warn\");}";
  if(!txt.includes(userTarget))throw new Error('Validação de usuários não localizada.');
  txt=txt.replace(userTarget,userRepl);

  // V26: corrige o modal antes de executar a aplicação.
  // Não usa template string com ${html}; cria o modal via DOM.
  const modalStart=txt.indexOf('function showModal(html,closable=true){');
  const modalEnd=txt.indexOf('window.closeModal=',modalStart);
  if(modalStart<0||modalEnd<0)throw new Error('Função de modal não localizada.');
  const modalFixed='function showModal(html,closable=true){\\n const host=document.getElementById("modalHost");\\n if(!host)return;\\n host.innerHTML="";\\n const overlay=document.createElement("div");\\n overlay.className="modal";\\n if(closable)overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal()});\\n const box=document.createElement("div");\\n box.className="modalBox";\\n box.innerHTML=String(html??"");\\n overlay.appendChild(box);\\n host.appendChild(overlay);\\n}\\n';
  txt=txt.slice(0,modalStart)+modalFixed+txt.slice(modalEnd);
  txt=txt.replace('</head>','<link rel="stylesheet" href="nilo-v25.css?v=26"></head>');
  txt=txt.replace('</body>','<script src="nilo-v25.js?v=26"></'+'script></body>');
  document.open();document.write(txt);document.close();
 }catch(e){
  console.error(e);
  document.getElementById('status').textContent='Não foi possível abrir a V26.';
  document.querySelector('.spin').style.display='none';
  document.getElementById('error').textContent=String(e&&e.message?e.message:e);
 }
})();</script></body></html>
