<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173653"><title>Central Temp V23</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f4f6;color:#173653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto 14px;background:#173653;color:#fff;font-weight:900}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:12px;color:#74818e;margin-top:7px}.error{font-size:11px;color:#a43131;margin-top:9px;max-width:650px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div id="status" class="msg">Abrindo sistema...</div><div class="spin"></div><div id="error" class="error"></div></div></div><script>(async()=>{const names=['v17-p01.txt','v17-p02.txt','v17-p03.txt','v17-p04.txt','v17-p05.txt','v17-p06.txt','v17-p07.txt','v17-p08.txt'];try{const parts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=23',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return (await r.text()).trim()}));const b=parts.join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação.');const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!txt.includes('Central Temp V17')||!txt.includes('</html>'))throw new Error('Versão interna incompleta.');document.open();document.write(txt);document.close()}catch(e){console.error(e);document.getElementById('status').textContent='Não foi possível abrir o sistema.';document.querySelector('.spin').style.display='none';document.getElementById('error').textContent=String(e&&e.message?e.message:e)}})();</script></body></html>
