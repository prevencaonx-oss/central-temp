<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Temp</title><style>html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f4f6f8;color:#173653}.loading{height:100%;display:grid;place-items:center}.box{text-align:center}.spin{width:38px;height:38px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div class="box"><div class="spin"></div><b>Central Temp</b><div style="font-size:12px;margin-top:6px;color:#6b7786">Carregando sistema...</div></div></div><script>(async()=>{try{const names=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];let b='';for(const n of names){const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n);b+=(await r.text()).trim()}const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div class="box"><b>Central Temp</b><div style="font-size:12px;margin-top:8px;color:#9b2c2c">Não foi possível carregar o sistema.</div></div></div>';console.error(e)}})();</script></body></html>
