<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f52"><title>Controle de Temperatura | Nilo V28</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#102653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{font-weight:1000;font-style:italic;font-size:42px;letter-spacing:-.08em;color:#ffe400;text-shadow:0 3px 0 #000}.sub{font-size:11px;color:#718096;margin-top:10px}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#071f52;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{font-size:11px;color:#a43131;margin-top:9px;max-width:760px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">NILO</div><b>CONTROLE DE TEMPERATURA</b><div id="status" class="sub">Abrindo sistema...</div><div class="spin"></div><div id="error" class="error"></div></div></div><script>(async()=>{try{const r=await fetch('app-v27.txt?v=28',{cache:'no-store'});if(!r.ok)throw new Error('app-v27.txt HTTP '+r.status);const raw=await r.text();let b64=raw.replace(/[^A-Za-z0-9+/=]/g,'');b64=b64.replace(/=+$/,'');while(b64.length%4)b64+='=';if(!b64||b64.length<1000)throw new Error('Arquivo do sistema vazio ou incompleto.');let decoded;try{decoded=atob(b64)}catch(err){throw new Error('Base64 ainda inválido. Tamanho bruto '+raw.length+', normalizado '+b64.length+'.')}const bytes=Uint8Array.from(decoded,c=>c.charCodeAt(0));if(bytes[0]!==31||bytes[1]!==139)throw new Error('Arquivo não é um pacote gzip válido.');if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação.');let html;try{const ds=new DecompressionStream('gzip');html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text()}catch(err){throw new Error('Pacote do sistema está truncado ou corrompido. Tamanho '+bytes.length+' bytes.')}if(!html.includes('Controle de Temperatura | Nilo V27')||!html.includes('</html>'))throw new Error('HTML interno incompleto.');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('status').textContent='Não foi possível abrir a V28.';document.querySelector('.spin').style.display='none';document.getElementById('error').textContent=String(e&&e.message?e.message:e)}})();</script></body></html>
