<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173653"><title>Central Temp V22</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f4f6;color:#173653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin:0 auto 14px;background:#173653;color:#fff;font-weight:900}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:12px;color:#74818e;margin-top:7px}.error{color:#a43131;max-width:540px;line-height:1.5}.detail{font-size:10px;color:#8b5a5a;margin-top:8px;max-width:700px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div id="status" class="msg">Carregando versão 22...</div><div class="spin"></div></div></div><script>(async()=>{const status=document.getElementById('status');const base='https://raw.githubusercontent.com/prevencaonx-oss/central-temp/main/';const names=['v17-p01.txt','v17-p02.txt','v17-p03.txt','v17-p04.txt','v17-p05.txt','v17-p06.txt','v17-p07.txt','v17-p08.txt'];const get=async(n)=>{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(base+n+'?v=22',{cache:'no-store',signal:ctl.signal});if(!r.ok)throw new Error(n+' respondeu HTTP '+r.status);return (await r.text()).trim()}catch(e){throw new Error('Falha em '+n+': '+(e?.message||e))}finally{clearTimeout(t)}};try{status.textContent='Baixando sistema...';const parts=await Promise.all(names.map(get));const b=parts.join('');status.textContent='Abrindo sistema...';const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('Este navegador precisa ser atualizado.');const ds=new DecompressionStream('gzip');let txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();if(!txt.includes('</html>')||!txt.includes('Central Temp V17'))throw new Error('O arquivo recebido está incompleto.');const old='function showModal(html,closable=true){document.getElementById("modalHost").innerHTML=`<div class="modal" ${closable?\'onclick="if(event.target===this)closeModal()"\':""}><div class="modalBox">${html}</div></div>`}\nwindow.closeModal=()=>document.getElementById("modalHost").innerHTML="";';const fixed='function showModal(content,closable=true){const host=document.getElementById("modalHost");if(!host)return;host.innerHTML="";const overlay=document.createElement("div");overlay.className="modal";if(closable)overlay.addEventListener("click",event=>{if(event.target===overlay)closeModal()});const box=document.createElement("div");box.className="modalBox";box.innerHTML=String(content??"");overlay.appendChild(box);host.appendChild(overlay)}\nwindow.closeModal=()=>{const host=document.getElementById("modalHost");if(host)host.innerHTML="";};';if(!txt.includes(old))throw new Error('Módulo de janelas não localizado para correção.');txt=txt.replace(old,fixed);txt=txt.replace('</head>','<link rel="stylesheet" href="protected-admin-v18.css?v=22"></head>');txt=txt.replace('</body>','<script src="protected-admin-v18.js?v=22"><\/script></body>');document.open();document.write(txt);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="boot"><div class="box"><div class="logo">CT</div><b>Central Temp</b><div class="msg error">Não foi possível abrir a V22.</div><div class="detail">'+String(e?.message||e)+'</div></div></div>'}})();</script></body></html>
