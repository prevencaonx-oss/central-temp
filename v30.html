<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173653"><title>Controle de Temperatura | Nilo V30</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f1f4f6;color:#173653}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.box{text-align:center}.logo{font-weight:1000;font-style:italic;font-size:42px;letter-spacing:-.08em;color:#ffe400;text-shadow:0 3px 0 #000}.spin{width:34px;height:34px;border:4px solid #dfe6eb;border-top-color:#173653;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:12px;color:#74818e;margin-top:7px}.error{font-size:11px;color:#a43131;margin-top:9px;max-width:700px;word-break:break-word}</style></head><body><div class="boot"><div class="box"><div class="logo">NILO</div><b>CONTROLE DE TEMPERATURA</b><div id="status" class="msg">Abrindo V30...</div><div class="spin"></div><div id="error" class="error"></div></div></div><script>(async()=>{
 const names=["v17-p01.txt","v17-p02.txt","v17-p03.txt","v17-p04.txt","v17-p05.txt","v17-p06.txt","v17-p07.txt","v17-p08.txt"];
 try{
  const parts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=30',{cache:'no-store'});if(!r.ok)throw new Error(n+' HTTP '+r.status);return (await r.text()).trim()}));
  const joined=parts.join('');
  const bytes=Uint8Array.from(atob(joined),c=>c.charCodeAt(0));
  if(typeof DecompressionStream==='undefined')throw new Error('Navegador sem suporte à descompactação.');
  const ds=new DecompressionStream('gzip');
  let txt=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
  if(!txt.includes('Central Temp V17')||!txt.includes('</html>'))throw new Error('Versão interna incompleta.');

  txt=txt.replace('<title>Central Temp V17 | Troca de Senha</title>','<title>Controle de Temperatura | Nilo V30</title>');

  // Corrige o modal na fonte antes de executar o sistema.
  const ms=txt.indexOf('function showModal(');
  const me=txt.indexOf('function closeModal',ms);
  if(ms<0||me<0)throw new Error('Função de modal não localizada.');
  const safeModal=`function showModal(html,closable=true){
 const host=document.getElementById("modalHost");
 if(!host)return;
 host.replaceChildren();
 const overlay=document.createElement("div");
 overlay.className="modal";
 if(closable)overlay.addEventListener("click",ev=>{if(ev.target===overlay)closeModal()});
 const box=document.createElement("div");
 box.className="modalBox";
 box.innerHTML=String(html??"");
 overlay.appendChild(box);
 host.appendChild(overlay);
}
`;
  txt=txt.slice(0,ms)+safeModal+txt.slice(me);

  // Segurança da conta / senha forte da V29.
  const accountMarker='     <div class="passwordChangeBox">\n       <h3>Alterar minha senha</h3>';
  const accountReplacement='     <div style="margin-top:10px;padding:10px;border:1px solid #dfe6eb;border-radius:10px;background:#f8fafb">\n       <label>Senha atual</label>\n       <input id="myCurrentPassword" type="password" autocomplete="current-password" placeholder="Obrigatória para confirmar a alteração">\n       <div class="passwordHint">Sua senha atual é usada apenas para confirmar sua identidade e não é armazenada em texto visível.</div>\n     </div>\n\n     <div class="passwordChangeBox">\n       <h3>Alterar minha senha</h3>';
  if(txt.includes(accountMarker))txt=txt.replace(accountMarker,accountReplacement);
  txt=txt.replace('placeholder="Mínimo de 6 caracteres"','placeholder="Mínimo de 10 caracteres"');
  txt=txt.replace('A senha deve ter pelo menos 6 caracteres.','Senha forte: 10+ caracteres, maiúscula, minúscula, número, especial e sem espaços.');

  txt=txt.replace('</head>','<link rel="stylesheet" href="nilo-v25.css?v=30"></head>');
  txt=txt.replace('</body>','<script src="nilo-v25.js?v=30"></'+'script></body>');
  document.open();document.write(txt);document.close();
 }catch(e){
  console.error(e);
  document.getElementById('status').textContent='Não foi possível abrir a V30.';
  document.querySelector('.spin').style.display='none';
  document.getElementById('error').textContent=String(e&&e.message?e.message:e);
 }
})();</script></body></html>
